<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Forgot Password | Noble Paint Service</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=home-theme-1">
  <script src="../assets/js/admin-password-reset.js" defer></script>
  <script src="../assets/js/admin-presentation.js" defer></script>
</head>
<body class="admin-login">
  <main>
    <section class="panel settings-panel">
      <p class="eyebrow">Noble Paint Service</p>
      <h1>Reset your password</h1>
      <p>Enter your admin sign-in email. If it belongs to an admin account, we’ll send a reset link that expires in 30 minutes.</p>
      <form id="forgot-password-form" class="form-grid">
        <label class="field wide">Admin email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
        <button class="button primary" type="submit">Send reset link</button>
      </form>
      <p id="password-reset-status" role="status" aria-live="polite"></p>
      <a href="./login.html">Back to sign in</a>
    </section>
  </main>
</body>
</html>
