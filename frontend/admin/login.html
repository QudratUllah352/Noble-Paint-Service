<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Sign In | Noble Paint Service</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=home-theme-1">
  <script src="../assets/js/admin-live.js" defer></script>
  <script src="../assets/js/admin-presentation.js" defer></script>
</head>
<body class="admin-login">
  <main>
    <section class="panel settings-panel">
      <p class="eyebrow">Noble Paint Service</p>
      <h1>Admin sign in</h1><p>Sign in to manage enquiries, appointments, team, projects and services.</p>
      <form id="admin-login" class="form-grid">
        <label class="field wide">Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
        <label class="field wide">Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
        <button class="button primary" type="submit">Sign in</button>
      </form>
      <p id="admin-status" role="status" aria-live="polite"></p>
      <p><a href="./forgot-password.html">Forgot password?</a></p>
      <a href="/">Back to website</a>
    </section>
  </main>
</body>
</html>
