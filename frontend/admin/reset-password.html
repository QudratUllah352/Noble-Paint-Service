<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Choose a New Password | Noble Paint Service</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=home-theme-1">
  <script src="../assets/js/admin-password-reset.js" defer></script>
  <script src="../assets/js/admin-presentation.js" defer></script>
</head>
<body class="admin-login">
  <main>
    <section class="panel settings-panel">
      <p class="eyebrow">Noble Paint Service</p>
      <h1>Choose a new password</h1>
      <p>Use a password between 12 and 256 characters. Reset links expire after 30 minutes and can only be used once.</p>
      <form id="reset-password-form" class="form-grid">
        <label class="field wide">New password<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
        <label class="field wide">Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
        <button class="button primary" type="submit">Reset password</button>
      </form>
      <p id="password-reset-status" role="status" aria-live="polite"></p>
      <a href="./login.html">Back to sign in</a>
    </section>
  </main>
</body>
</html>
