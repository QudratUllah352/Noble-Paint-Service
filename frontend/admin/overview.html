<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Live Overview | Noble Paint Service</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=home-theme-1">
  <script src="../assets/js/admin-shell.js?v=5" defer></script>
  <script src="../assets/js/admin-live.js" defer></script>
  <script src="../assets/js/admin-presentation.js" defer></script>
</head>
<body>
  <main id="main" tabindex="-1">
    <div class="section-title"><h1>Enquiry overview</h1><button id="admin-logout" class="button secondary">Sign out</button></div>
    <p>Track enquiries from your homepage and Contact page.</p>
    <div class="settings-actions"><a class="button primary" href="./enquiries.html">View all enquiries</a><button id="refresh-overview" class="button secondary">Refresh overview</button></div>
    <p id="admin-status" role="status" aria-live="polite">Loading overview…</p>
    <section id="live-overview" aria-label="Enquiry totals"></section>
    <section class="panel settings-panel"><h2>Projects</h2><p><a class="button secondary" href="./projects.html">Manage projects</a></p><div id="project-summary"></div></section>
    <section class="panel settings-panel"><h2>Upcoming appointments</h2><p><a class="button secondary" href="./appointments.html">Manage appointments</a></p><div id="upcoming-appointments"></div></section>
    <section class="panel settings-panel"><h2>Latest enquiries</h2><div id="recent-enquiries"></div></section>
  </main>
</body>
</html>
